[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ndx-hed"
dynamic = ["version"]
authors = [
    { name="Kay Robbins", email="kay.robbins@utsa.edu" },
    { name="Ryan Ly", email="rly@lbl.gov" },
    { name="Oliver Ruebel", email="oruebel@lbl.gov" },
    { name="Ian Callanan", email="ianrcallanan@gmail.com"}
]
description = "NWB extension for HED data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
]
keywords = [
    'NeurodataWithoutBorders',
    'NWB',
    'nwb-extension',
    'ndx-extension',
]
dependencies = [
    "pynwb>=4.1.0",
    "hdmf>=6.1.0",
    # hedtools is installed from the hed-python main branch while hed-python gains
    # the support ndx-hed needs. Before a release this reverts to a PyPI pin
    # (hedtools>=<version>), and constraints/*.txt get their hedtools lines back.
    # Installing needs git on PATH.
    "hedtools @ git+https://github.com/hed-standard/hed-python.git@main",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-subtests>=0.12.0",
    "coverage>=7.5.4",
    "python-dateutil>=2.8.2",
]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-subtests>=0.12.0",
    "coverage>=7.5.4",
    "python-dateutil>=2.8.2",
    "ruff>=0.16.0",
    "typos>=1.29.0",
    "pre-commit>=3.5.0",
    "mdformat>=0.7.0",
    "mdformat-myst>=0.1.5",
]
docs = [
    "sphinx>=9.0.0,<10.0",
    "sphinx-book-theme>=1.1.3",
    "sphinx-design>=0.6.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autodoc-typehints>=3.0.0,<3.12.1",
    "myst-parser[linkify]>=3.0.1",
    "hdmf-docutils>=0.4.7",
]

# Needed while a dependency is a direct git reference (see dependencies above);
# remove together with that reference.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[project.urls]
"Homepage" = "https://github.com/hed-standard/ndx-hed"
"Documentation" = "https://www.hedtags.org/ndx-hed"
"Bug Tracker" = "https://github.com/hed-standard/ndx-hed/issues"
"Discussions" = "https://github.com/orgs/hed-standard/discussions"
"Changelog" = "https://github.com/hed-standard/ndx-hed/CHANGELOG.md"

[tool.hatch.build]
include = [
    "src/pynwb",
    "spec/ndx-hed.extensions.yaml",
    "spec/ndx-hed.namespace.yaml",
]
exclude = [
    "src/pynwb/tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/pynwb/ndx_hed",
    "spec"
]

[tool.hatch.build.targets.wheel.sources]
"spec" = "ndx_hed/spec"

[tool.hatch.build.targets.sdist]
include = [
    "src/pynwb",
    "spec/ndx-hed.extensions.yaml",
    "spec/ndx-hed.namespace.yaml",
    "docs",
]
exclude = []

[tool.typos.files]
extend-exclude = [
    "htmlcov",
    ".mypy_cache",
    ".pytest_cache",
    ".coverage",
    "*.pdf",
    "*.svg",
    "venvs",
    ".tox",
    "hdmf-common-schema",
    "docs/_build",
    "*.ipynb",
    "deprecated",
    "*.xml",
    "*.mediawiki",
    "*.omn",
]

[tool.typos.default.extend-words]
assertIn = "assertIn"
hed = "hed"
parms = "parms"
covert = "covert"
recuse = "recuse"
disjointness = "disjointness"
seperate = "seperate"

[tool.coverage.run]
branch = true
source = ["src/pynwb"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@abstract"
]

[tool.ruff]
target-version = "py310"
line-length = 120
# The package lives under src/pynwb/; without this, ruff's first-party detection
# sees the src/pynwb directory and sorts `pynwb` imports as first-party.
src = ["src/pynwb"]
exclude = [
  ".git",
  ".mypy_cache",
  ".tox",
  ".venv",
  "venv",
  "__pycache__",
  ".ipynb_checkpoints",
  "_build/",
  "build/",
  "dist/",
  "__pypackages__",
  "*.ipynb",
  "docs/",
  ".status",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "T100", # debugger left in code
    "T201", # print in library code (examples and the spec script are exempt below)
    "T203", # pprint in library code
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# __init__.py files: unused imports are re-exports, and their import order is
# curated by hand to avoid circular imports - isort must not reorder them.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"src/spec/create_extension_spec.py" = ["T201"]
"src/pynwb/ndx_hed/__init__.py" = ["E402"]
"examples/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["ndx_hed"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
preview = true
