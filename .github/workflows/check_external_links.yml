name: Check Sphinx external links
on:
  push:
  schedule:
    - cron: '0 5 * * *'  # once per day at midnight ET
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-external-links:
    name: Check for broken Sphinx external links
    runs-on: ubuntu-latest
    steps:
      - name: Cancel any previous incomplete runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66  # v0.13.1
        with:
          all_but_latest: true
          access_token: ${{ github.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Sphinx dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]" -c constraints/pinned.txt

      - name: Check Sphinx external links
        run: |
          cd docs  # run_doc_autogen assumes spec is found in ../spec/
          sphinx-build -b linkcheck ./source ./test_build
